name: Test action

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      otp_version:
        description: Erlang/OTP version to test (defaults to the latest registered version)
        required: false
        type: string
      aws_lc_version:
        description: AWS-LC version to test (defaults to the latest registered version)
        required: false
        type: string
  workflow_call:
    inputs:
      otp_version:
        description: Erlang/OTP version to test (defaults to the latest registered version)
        required: false
        type: string
      aws_lc_version:
        description: AWS-LC version to test (defaults to the latest registered version)
        required: false
        type: string

permissions:
  contents: read

jobs:
  versions:
    name: Resolve the versions under test
    runs-on: ubuntu-slim
    outputs:
      otp_version: ${{ steps.versions.outputs.otp_version }}
      aws_lc_version: ${{ steps.versions.outputs.aws_lc_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_call では既定の checkout が呼び出し元コミットを取るため、
          # release ジョブが push した versions/builds.tsv を読めない。
          # ref を明示してブランチの最新 (push 済みのマニフェスト) を取る
          ref: ${{ github.ref }}

      - name: Resolve the versions under test
        id: versions
        env:
          INPUT_OTP_VERSION: ${{ inputs.otp_version }}
          INPUT_AWS_LC_VERSION: ${{ inputs.aws_lc_version }}
        run: |
          set -euo pipefail
          # 指定が無ければ versions/builds.tsv の最新 (OTP → AWS-LC の順にソート済み) を使う
          otp_version="${INPUT_OTP_VERSION}"
          if [[ -z "${otp_version}" ]]; then
            otp_version="$(awk -F'\t' '!/^[[:space:]]*(#|$)/ && NF >= 6 { v = $1 } END { print v }' versions/builds.tsv)"
          fi
          aws_lc_version="${INPUT_AWS_LC_VERSION}"
          if [[ -z "${aws_lc_version}" ]]; then
            aws_lc_version="$(awk -F'\t' -v otp="${otp_version}" '!/^[[:space:]]*(#|$)/ && NF >= 6 && $1 == otp { v = $2 } END { print v }' versions/builds.tsv)"
          fi
          if [[ -z "${otp_version}" || -z "${aws_lc_version}" ]]; then
            echo "no builds are registered in versions/builds.tsv" >&2
            exit 1
          fi
          printf 'test-action: Erlang/OTP %s with AWS-LC %s\n' "${otp_version}" "${aws_lc_version}"
          printf 'otp_version=%s\n' "${otp_version}" >> "${GITHUB_OUTPUT}"
          printf 'aws_lc_version=%s\n' "${aws_lc_version}" >> "${GITHUB_OUTPUT}"

  install:
    name: Install (${{ matrix.runner }})
    needs: versions
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - ubuntu-slim
          - macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ref の最新を取る (versions ジョブ参照)
          ref: ${{ github.ref }}

      - name: Install Erlang/OTP
        uses: ./
        with:
          otp-version: ${{ needs.versions.outputs.otp_version }}
          aws-lc-version: ${{ needs.versions.outputs.aws_lc_version }}

      - name: Install Erlang/OTP again
        uses: ./
        with:
          otp-version: ${{ needs.versions.outputs.otp_version }}
          aws-lc-version: ${{ needs.versions.outputs.aws_lc_version }}

      - name: Smoke test
        run: |
          set -euo pipefail
          output="$(erl -noshell -eval '{ok, _} = application:ensure_all_started(crypto), [{_, _, VersionString} | _] = crypto:info_lib(), io:format("~s~n", [VersionString]), halt().')"
          echo "crypto backend: ${output}"
          case "${output}" in
            *AWS-LC*) ;;
            *)
              echo "crypto is not linked against AWS-LC"
              exit 1
              ;;
          esac

          work_dir="$(mktemp -d)"
          cat > "${work_dir}/hello.erl" <<'ERL'
          -module(hello).
          -export([main/0]).
          main() -> io:format("hello from setup-erlang~n").
          ERL
          erlc -o "${work_dir}" "${work_dir}/hello.erl"
          erl -noshell -pa "${work_dir}" -eval 'hello:main(), halt().'

  plt:
    name: Base PLT
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # 公式リリースの rebar3 を固定して使う
      REBAR3_VERSION: 3.25.1
      REBAR3_SHA256: 924576737f0d3098e1fa4691e6f542bf61036d234c61ebdc18aafef8e2bccf67
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ref の最新を取る (versions ジョブ参照)
          ref: ${{ github.ref }}

      - name: Install Erlang/OTP with the base PLT
        id: setup
        uses: ./
        with:
          otp-version: ${{ needs.versions.outputs.otp_version }}
          aws-lc-version: ${{ needs.versions.outputs.aws_lc_version }}
          use-cache: "true"

      - name: Smoke test the base PLT
        run: |
          set -euo pipefail
          plt_path="${{ steps.setup.outputs.plt-path }}"
          test -s "${plt_path}"

          # rebar3 が読む場所にも同じファイルが配置されていること
          rebar3_plt="${HOME}/.cache/rebar3/$(basename "${plt_path}")"
          test -f "${rebar3_plt}"
          cmp "${plt_path}" "${rebar3_plt}"

          # incremental PLT として読めること
          base_modules="$(PLT_FILE="${plt_path}" erl -noshell -eval '
            case dialyzer:plt_info(os:getenv("PLT_FILE")) of
                {ok, {incremental, [{modules, Modules}]}} -> io:format("~b", [length(Modules)]);
                _ -> halt(1)
            end, halt().')"
          echo "base PLT modules: ${base_modules}"
          test "${base_modules}" -gt 0
          echo "BASE_PLT_MODULES=${base_modules}" >> "${GITHUB_ENV}"

      - name: Download rebar3
        run: |
          set -euo pipefail
          rebar3_dir="$(mktemp -d)"
          curl -fsSL -o "${rebar3_dir}/rebar3" \
            "https://github.com/erlang/rebar3/releases/download/${REBAR3_VERSION}/rebar3"
          echo "${REBAR3_SHA256}  ${rebar3_dir}/rebar3" | sha256sum -c -
          chmod +x "${rebar3_dir}/rebar3"
          echo "REBAR3_DIR=${rebar3_dir}" >> "${GITHUB_ENV}"

      - name: Dialyze a project with rebar3
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          project_dir="${work_dir}/project"
          mkdir -p "${project_dir}/src"
          cat > "${project_dir}/rebar.config" <<'CONFIG'
          {erl_opts, [debug_info]}.
          {dialyzer, [{warnings, [extra_return, missing_return, no_unknown]},
                      incremental,
                      {plt_apps, top_level_deps},
                      {plt_location, local},
                      {base_plt_location, global}]}.
          CONFIG
          cat > "${project_dir}/src/testapp.app.src" <<'APP'
          {application, testapp,
           [{description, "setup-erlang test"},
            {vsn, "0.1.0"},
            {registered, []},
            {applications, [kernel, stdlib]},
            {env, []}]}.
          APP
          cat > "${project_dir}/src/testapp.erl" <<'ERL'
          -module(testapp).
          -export([f/1]).
          f(X) -> X + 1.
          ERL

          cd "${project_dir}"
          log="${work_dir}/dialyzer.log"
          "${REBAR3_DIR}/rebar3" dialyzer -i > "${log}" 2>&1
          cat "${log}"

          if grep -q 'Creating base plt' "${log}"; then
            echo "rebar3 rebuilt the base PLT; use-plt must provide it"
            exit 1
          fi
          grep -q 'Running incremental analysis' "${log}"

          # ベース PLT が project PLT のシードとして使われたことを確認する
          project_plts=(_build/default/rebar3_*_iplt)
          test -f "${project_plts[0]}"
          project_modules="$(PLT_FILE="${project_plts[0]}" erl -noshell -eval '
            case dialyzer:plt_info(os:getenv("PLT_FILE")) of
                {ok, {incremental, [{modules, Modules}]}} -> io:format("~b", [length(Modules)]);
                _ -> halt(1)
            end, halt().')"
          echo "project PLT modules: ${project_modules}"
          if (( project_modules <= BASE_PLT_MODULES )); then
            echo "the project PLT does not contain the base PLT modules"
            exit 1
          fi

          # warnings をカスタムしていないプロジェクトでも使えることを確認する
          default_project="${work_dir}/project-default"
          mkdir -p "${default_project}/src"
          cat > "${default_project}/rebar.config" <<'CONFIG'
          {erl_opts, [debug_info]}.
          {dialyzer, [incremental,
                      {plt_apps, top_level_deps},
                      {plt_location, local},
                      {base_plt_location, global}]}.
          CONFIG
          cp "${project_dir}/src/testapp.app.src" "${default_project}/src/"
          cp "${project_dir}/src/testapp.erl" "${default_project}/src/"

          cd "${default_project}"
          "${REBAR3_DIR}/rebar3" dialyzer -i > "${log}" 2>&1
          cat "${log}"
          if grep -q 'Creating base plt' "${log}"; then
            echo "rebar3 rebuilt the base PLT with the default warnings"
            exit 1
          fi

          # project PLT が残っていれば 2 回目は解析なしで通る
          "${REBAR3_DIR}/rebar3" dialyzer -i > "${log}" 2>&1
          grep -q 'Running incremental analysis' "${log}"

  resolve:
    name: Resolve versions
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ref の最新を取る (versions ジョブ参照)
          ref: ${{ github.ref }}

      - name: Reject versions that are not registered
        run: |
          check_rejected() {
            local version="$1"
            if INPUT_OTP_VERSION="${version}" bash scripts/install.sh resolve >/dev/null 2>&1; then
              echo "${version} must not resolve because it is not registered in the manifest"
              exit 1
            fi
            echo "${version} was rejected as expected"
          }

          # 系統指定と latest は受け付けない
          check_rejected "latest"
          check_rejected "29"

          # 完全一致の指定は、そのバージョンが無ければエラーになる
          if awk -F'\t' '$1 == "29.0" { found = 1 } END { exit !found }' versions/builds.tsv; then
            echo "29.0 is registered in the manifest; skipping the 29.0 check"
          else
            check_rejected "29.0"
          fi

      - name: Reject a row without a PLT asset
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          printf '# otp_version\taws_lc_version\ttarget\tasset\tsha256\tsource_ref\n' > "${work_dir}/builds.tsv"
          printf '29.1\tv5.9.0\taarch64-apple-darwin\totp-aarch64-apple-darwin.tar.gz\tdeadbeef\tshiguredo/otp@deadbeef\n' >> "${work_dir}/builds.tsv"

          if SETUP_ERLANG_MANIFEST="${work_dir}/builds.tsv" \
             INPUT_OTP_VERSION=29.1 \
             INPUT_AWS_LC_VERSION=v5.9.0 \
             INPUT_OTP_TARGET=aarch64-apple-darwin \
             INPUT_USE_PLT=true \
             bash scripts/install.sh resolve >/dev/null 2>&1; then
            echo "resolve must fail when the row has no PLT asset"
            exit 1
          fi
          echo "resolve rejected the row without a PLT asset as expected"

      - name: Resolve the latest version in local mode
        run: |
          set -euo pipefail
          target="x86_64-unknown-linux-gnu"
          expected_otp="$(awk -F'\t' -v target="${target}" '!/^[[:space:]]*(#|$)/ && NF >= 6 && $3 == target { v = $1 } END { print v }' versions/builds.tsv)"
          expected_aws_lc="$(awk -F'\t' -v otp="${expected_otp}" -v target="${target}" '!/^[[:space:]]*(#|$)/ && NF >= 6 && $1 == otp && $3 == target { v = $2 } END { print v }' versions/builds.tsv)"

          work_dir="$(mktemp -d)"
          output="$(env -u GITHUB_ACTIONS -u RUNNER_TOOL_CACHE HOME="${work_dir}/home" bash scripts/install.sh resolve)"
          printf '%s\n' "${output}"

          [[ "$(printf '%s\n' "${output}" | sed -n 's/^otp_version=//p')" == "${expected_otp}" ]]
          [[ "$(printf '%s\n' "${output}" | sed -n 's/^aws_lc_version=//p')" == "${expected_aws_lc}" ]]
          [[ "$(printf '%s\n' "${output}" | sed -n 's/^install_root=//p')" == "${work_dir}/home/.local/share/setup-erlang/${expected_otp}-aws-lc-${expected_aws_lc}" ]]
          echo "local mode resolved Erlang/OTP ${expected_otp} with AWS-LC ${expected_aws_lc}"

      - name: Resolve when the script is read from stdin
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          output="$(cat scripts/install.sh | env -u GITHUB_ACTIONS XDG_CACHE_HOME="${work_dir}/cache" SETUP_ERLANG_MANIFEST_URL="file://${PWD}/versions/builds.tsv" bash -s -- resolve --target aarch64-apple-darwin)"
          printf '%s\n' "${output}"
          test -f "${work_dir}/cache/setup-erlang/manifest.tsv"
          printf '%s\n' "${output}" | grep -q '^otp_version='

      - name: Resolve using the cached manifest when the download fails
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          mkdir -p "${work_dir}/cache/setup-erlang"
          cp versions/builds.tsv "${work_dir}/cache/setup-erlang/manifest.tsv"
          output="$(env -u GITHUB_ACTIONS XDG_CACHE_HOME="${work_dir}/cache" SETUP_ERLANG_MANIFEST_URL="file:///nonexistent/builds.tsv" bash scripts/install.sh resolve --target aarch64-apple-darwin 2>/dev/null)"
          printf '%s\n' "${output}"
          printf '%s\n' "${output}" | grep -q '^otp_version='

  local-install:
    name: Local install (${{ matrix.runner }})
    needs: versions
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ref の最新を取る (versions ジョブ参照)
          ref: ${{ github.ref }}

      - name: Install Erlang/OTP as a local installer
        env:
          OTP_VERSION: ${{ needs.versions.outputs.otp_version }}
          AWS_LC_VERSION: ${{ needs.versions.outputs.aws_lc_version }}
          LOCAL_HOME: ${{ runner.temp }}/setup-erlang-home
        run: |
          set -euo pipefail
          run_local() {
            env -u GITHUB_ACTIONS -u GITHUB_OUTPUT -u GITHUB_PATH -u RUNNER_TOOL_CACHE \
              HOME="${LOCAL_HOME}" \
              "$@"
          }
          mkdir -p "${LOCAL_HOME}"
          root="${LOCAL_HOME}/.local/share/setup-erlang"

          # GitHub Actions の環境変数を外して、ローカルのインストーラーとして実行する
          run_local bash scripts/install.sh install "${OTP_VERSION}" "${AWS_LC_VERSION}"

          # current がインストールしたバージョンを指すこと
          test -L "${root}/current"
          test "$(readlink "${root}/current")" = "${OTP_VERSION}-aws-lc-${AWS_LC_VERSION}"

          # current 経由の erl が AWS-LC で動くこと
          output="$(PATH="${root}/current/bin:${PATH}" erl -noshell -eval '{ok, _} = application:ensure_all_started(crypto), [{_, _, VersionString} | _] = crypto:info_lib(), io:format("~s~n", [VersionString]), halt().')"
          echo "crypto backend: ${output}"
          case "${output}" in
            *AWS-LC*) ;;
            *)
              echo "crypto is not linked against AWS-LC"
              exit 1
              ;;
          esac

          # 2 回目のインストールはダウンロードせずに成功すること
          run_local bash scripts/install.sh install "${OTP_VERSION}" "${AWS_LC_VERSION}" > "${RUNNER_TEMP}/reinstall.log" 2>&1
          grep -q 'is already installed' "${RUNNER_TEMP}/reinstall.log"

          # current を切り替えられること
          bash scripts/install.sh use --root "${root}" "${OTP_VERSION}" "${AWS_LC_VERSION}"
          test "$(readlink "${root}/current")" = "${OTP_VERSION}-aws-lc-${AWS_LC_VERSION}"

          # インストール済みのバージョンが表示されること
          bash scripts/install.sh list --root "${root}" > "${RUNNER_TEMP}/list.log"
          grep -Fq -- "* ${OTP_VERSION}-aws-lc-${AWS_LC_VERSION}" "${RUNNER_TEMP}/list.log"
