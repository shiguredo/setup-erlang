name: Build Erlang/OTP

on:
  workflow_dispatch:
    inputs:
      otp_version:
        description: Erlang/OTP version (example 29.1.2)
        required: true
        type: string
      aws_lc_version:
        description: AWS-LC version (example v5.11.0)
        required: true
        default: v5.11.0
        type: string
      source_repository:
        description: Erlang/OTP repository
        required: false
        default: shiguredo/otp
        type: string
      publish:
        description: Create a GitHub Release and update versions/builds.tsv
        required: false
        default: true
        type: boolean
      plt_only:
        description: >
          Regenerate only the base PLT assets of an existing release without
          rebuilding Erlang/OTP
        required: false
        default: false
        type: boolean
      debug:
        description: >
          Build the debug variant and publish otp-<target>-debug.tar.gz to the
          same GitHub Release as the release build. The release build must
          already be in versions/builds.tsv. Cannot be combined with plt_only
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  reject:
    name: Reject debug with plt_only
    if: ${{ inputs.debug && inputs.plt_only }}
    runs-on: ubuntu-slim
    steps:
      - name: Fail
        run: |
          echo "debug and plt_only cannot be combined. The debug build reuses the release base PLT." >&2
          exit 1

  build:
    name: Build ${{ matrix.target }}
    if: ${{ !inputs.plt_only }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-26
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        env:
          DEBUG: ${{ inputs.debug && 'true' || 'false' }}
        run: |
          packages=(
            autoconf
            build-essential
            cmake
            curl
            git
            golang
            libncurses-dev
            ninja-build
          )
          # systemtap-sdt-dev が dtrace 互換コマンドと sys/sdt.h を提供する
          if [[ "${DEBUG}" == "true" ]]; then
            packages+=(systemtap-sdt-dev)
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          missing=()
          for tool in cmake ninja go; do
            if ! command -v "${tool}" >/dev/null 2>&1; then
              missing+=("${tool}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            brew install "${missing[@]}"
          fi

      - name: Require the release build
        if: inputs.debug
        env:
          OTP_VERSION: ${{ inputs.otp_version }}
          AWS_LC_VERSION: ${{ inputs.aws_lc_version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if ! awk -F'\t' -v otp="${OTP_VERSION}" -v aws_lc="${AWS_LC_VERSION}" -v target="${TARGET}" '
            function row_debug() { return (NF >= 9 && $9 == "true") ? "true" : "false" }
            NF >= 8 && $1 == otp && $2 == aws_lc && $3 == target && row_debug() == "false" && $7 != "" {
              found = 1
            }
            END { exit !found }
          ' versions/builds.tsv; then
            echo "no release PLT for Erlang/OTP ${OTP_VERSION} AWS-LC ${AWS_LC_VERSION} ${TARGET}; publish the release build first" >&2
            exit 1
          fi

      - name: Build Erlang/OTP with AWS-LC
        env:
          OTP_VERSION: ${{ inputs.otp_version }}
          AWS_LC_VERSION: ${{ inputs.aws_lc_version }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          TARGET: ${{ matrix.target }}
          DEBUG: ${{ inputs.debug && 'true' || 'false' }}
          WORK_DIR: ${{ runner.temp }}/setup-erlang-work
          OUTPUT_DIR: ${{ runner.temp }}/setup-erlang-out
        run: ./build/build.sh

      - name: Upload asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: otp-${{ matrix.target }}
          path: ${{ runner.temp }}/setup-erlang-out/*
          if-no-files-found: error
          retention-days: 7

  plt:
    name: Build base PLT ${{ matrix.target }}
    if: ${{ inputs.plt_only && !inputs.debug }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-26
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the release asset
        env:
          GH_TOKEN: ${{ github.token }}
          OTP_VERSION: ${{ inputs.otp_version }}
          AWS_LC_VERSION: ${{ inputs.aws_lc_version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          release_tag="otp-${OTP_VERSION}-aws-lc-${AWS_LC_VERSION}"
          mkdir -p work/erlang
          gh release download "${release_tag}" --pattern "otp-${TARGET}.tar.gz" --dir work
          tar -xzf "work/otp-${TARGET}.tar.gz" -C work/erlang

      - name: Build the base PLT
        env:
          ERLANG_ROOT: ${{ github.workspace }}/work/erlang
          OUTPUT_PLT: ${{ runner.temp }}/setup-erlang-out/otp-${{ matrix.target }}.iplt
        run: ./build/build-plt.sh

      - name: Upload asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: otp-${{ matrix.target }}
          path: ${{ runner.temp }}/setup-erlang-out/*.iplt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    needs: [build, plt]
    if: ${{ inputs.publish && !cancelled() && (needs.build.result == 'success' || needs.plt.result == 'success') }}
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.manifest.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: otp-*
          path: artifacts
          merge-multiple: true

      - name: Download the existing assets
        if: inputs.plt_only
        env:
          GH_TOKEN: ${{ github.token }}
          OTP_VERSION: ${{ inputs.otp_version }}
          AWS_LC_VERSION: ${{ inputs.aws_lc_version }}
        run: |
          set -euo pipefail
          release_tag="otp-${OTP_VERSION}-aws-lc-${AWS_LC_VERSION}"
          gh release download "${release_tag}" --pattern "otp-*.tar.gz" --dir artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          OTP_VERSION: ${{ inputs.otp_version }}
          AWS_LC_VERSION: ${{ inputs.aws_lc_version }}
          PLT_ONLY: ${{ inputs.plt_only }}
          DEBUG: ${{ inputs.debug && 'true' || 'false' }}
        run: |
          set -euo pipefail
          release_tag="otp-${OTP_VERSION}-aws-lc-${AWS_LC_VERSION}"
          cd artifacts
          files=()
          if [[ "${DEBUG}" == "true" ]]; then
            for f in otp-*-debug.tar.gz; do
              [[ -f "${f}" ]] || continue
              files+=("${f}")
            done
          else
            for f in otp-*.tar.gz otp-*.iplt; do
              [[ -f "${f}" ]] || continue
              [[ "${f}" == *-debug.tar.gz ]] && continue
              files+=("${f}")
            done
          fi
          if (( ${#files[@]} == 0 )); then
            echo "no assets to publish" >&2
            exit 1
          fi
          # update-manifest は今回のバリアントの行だけを読む。
          # GitHub Release の SHA256SUMS は既存のもう一方のバリアントを残す
          sha256sum "${files[@]}" > SHA256SUMS
          upload_sums="$(mktemp)"
          cp SHA256SUMS "${upload_sums}"
          release_exists=false
          if gh release view "${release_tag}" >/dev/null 2>&1; then
            release_exists=true
            previous="$(mktemp -d)"
            if gh release download "${release_tag}" --pattern SHA256SUMS --dir "${previous}"; then
              awk 'NR == FNR { replaced[$2] = 1; next } !($2 in replaced)' \
                SHA256SUMS "${previous}/SHA256SUMS" > "${upload_sums}.kept"
              cat "${upload_sums}.kept" SHA256SUMS > "${upload_sums}"
            fi
          elif [[ "${PLT_ONLY}" == "true" ]]; then
            echo "release ${release_tag} does not exist" >&2
            exit 1
          fi
          if [[ "${release_exists}" == "true" ]]; then
            gh release upload "${release_tag}" "${files[@]}" "${upload_sums}#SHA256SUMS" --clobber
          else
            notes="Prebuilt Erlang/OTP ${OTP_VERSION} with AWS-LC ${AWS_LC_VERSION}."
            if [[ "${DEBUG}" == "true" ]]; then
              notes="${notes} Includes the debug build."
            fi
            gh release create "${release_tag}" "${files[@]}" "${upload_sums}#SHA256SUMS" \
              --title "Erlang/OTP ${OTP_VERSION} with AWS-LC ${AWS_LC_VERSION}" \
              --notes "${notes}"
          fi

      - name: Update manifest
        id: manifest
        env:
          OTP_VERSION: ${{ inputs.otp_version }}
          AWS_LC_VERSION: ${{ inputs.aws_lc_version }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          PLT_ONLY: ${{ inputs.plt_only }}
          DEBUG: ${{ inputs.debug && 'true' || 'false' }}
        run: |
          ./build/update-manifest.sh

          if git diff --quiet -- versions/builds.tsv; then
            echo "manifest is unchanged"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            if [[ "${PLT_ONLY}" == "true" ]]; then
              message="Erlang/OTP ${OTP_VERSION} と AWS-LC ${AWS_LC_VERSION} のベース PLT を追加する"
            elif [[ "${DEBUG}" == "true" ]]; then
              message="Erlang/OTP ${OTP_VERSION} と AWS-LC ${AWS_LC_VERSION} のデバッグ版バイナリを追加する"
            else
              message="Erlang/OTP ${OTP_VERSION} と AWS-LC ${AWS_LC_VERSION} のバイナリを追加する"
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add versions/builds.tsv
            git commit -m "${message}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

  test:
    name: Test the release
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.changed == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/test-action.yml
    with:
      otp_version: ${{ inputs.otp_version }}
      aws_lc_version: ${{ inputs.aws_lc_version }}
