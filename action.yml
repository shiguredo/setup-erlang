name: setup-erlang

description: Install prebuilt Erlang/OTP with AWS-LC on GitHub Actions runners

author: Shiguredo Inc.

branding:
  color: blue
  icon: download

inputs:
  otp-version:
    description: >
      Exact Erlang/OTP version to install (example: 29.1)
    required: true
  aws-lc-version:
    description: >
      AWS-LC version to install. Accepts "v5.9.0" or "5.9.0". Defaults to the
      latest AWS-LC version built for the specified Erlang/OTP version
    required: false
  otp-target:
    description: >
      Target triple override. Normally detected from the runner.
      Example: aarch64-apple-darwin
    required: false
  use-cache:
    description: >
      Cache the extracted Erlang/OTP directory with actions/cache. Caching is
      skipped on self-hosted runners because RUNNER_TOOL_CACHE persists there
    required: false
    default: "false"
  use-plt:
    description: >
      Download the dialyzer base PLT (incremental) of the release and install it
      at ~/.cache/rebar3, where rebar3 looks for the base PLT by default. The
      release must contain the PLT asset
    required: false
    default: "false"

outputs:
  otp-version:
    description: The exact Erlang/OTP version that was installed
    value: ${{ steps.install.outputs.otp_version }}
  aws-lc-version:
    description: The exact AWS-LC version that was installed
    value: ${{ steps.install.outputs.aws_lc_version }}
  erlang-root-dir:
    description: The directory where Erlang/OTP was installed
    value: ${{ steps.install.outputs.install_root }}
  plt-path:
    description: >
      The path of the dialyzer base PLT. The file exists when use-plt is
      enabled
    value: ${{ steps.install.outputs.plt_path }}

runs:
  using: composite
  steps:
    - name: Resolve Erlang/OTP version
      id: resolve
      shell: bash
      env:
        INPUT_OTP_VERSION: ${{ inputs.otp-version }}
        INPUT_AWS_LC_VERSION: ${{ inputs.aws-lc-version }}
        INPUT_OTP_TARGET: ${{ inputs.otp-target }}
        INPUT_USE_PLT: ${{ inputs.use-plt }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/install.sh" resolve

    - name: Restore Erlang/OTP cache
      if: inputs.use-cache == 'true' && runner.environment == 'github-hosted'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.resolve.outputs.install_root }}
        key: setup-erlang-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve.outputs.otp_version }}-${{ steps.resolve.outputs.aws_lc_version }}

    - name: Install Erlang/OTP
      id: install
      shell: bash
      env:
        INPUT_OTP_VERSION: ${{ inputs.otp-version }}
        INPUT_AWS_LC_VERSION: ${{ inputs.aws-lc-version }}
        INPUT_OTP_TARGET: ${{ inputs.otp-target }}
        INPUT_USE_PLT: ${{ inputs.use-plt }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/install.sh" install
